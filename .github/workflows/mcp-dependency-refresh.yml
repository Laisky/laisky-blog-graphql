name: MCP dependency refresh evidence

on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths: ['.github/workflows/mcp-dependency-refresh.yml', '.github/mcp-compatibility.patch']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prepared: ${{ steps.prepare.outputs.prepared }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare dependency and compatibility changes
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcp-upgrade-evidence
          git apply --check .github/mcp-compatibility.patch
          git apply .github/mcp-compatibility.patch
          go get -u -t ./... 2>&1 | tee /tmp/mcp-upgrade-evidence/go-get.log
          go get github.com/mark3labs/mcp-go@v1.1.1 github.com/pashagolub/pgxmock/v5@v5.2.0
          go mod tidy
          make gen 2>&1 | tee /tmp/mcp-upgrade-evidence/codegen.log
          go mod tidy
          go mod verify
          go list -m all > /tmp/mcp-upgrade-evidence/modules.txt
          git diff --check
          git diff --binary > /tmp/mcp-upgrade-evidence/implementation.patch
          tar --exclude=.git -czf /tmp/mcp-upgrade-evidence/source.tar.gz .
          echo 'prepared=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-upgrade-prepared
          path: /tmp/mcp-upgrade-evidence/
          retention-days: 7
      - name: MCP transport acceptance
        if: ${{ !cancelled() && steps.prepare.outputs.prepared == 'true' }}
        run: go test -race -count=1 -v ./internal/mcp -run 'TestMCPStableSDK|TestServerSupportsMCPProtocol|TestServerKeepsLegacyMCP'
      - name: Full Go behavior and race tests
        if: ${{ !cancelled() && steps.prepare.outputs.prepared == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          go test -race -cover -timeout 5m ./... 2>&1 | tee /tmp/mcp-tests.log
      - name: Build, vet and repository invariants
        if: ${{ !cancelled() && steps.prepare.outputs.prepared == 'true' }}
        run: |
          go build ./...
          go vet ./...
          make lint-pure-go lint-system-owner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-upgrade-tests
          path: /tmp/mcp-tests.log
          retention-days: 7

  publish:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.prepared == 'true' && github.repository == 'Laisky/laisky-blog-graphql' && github.ref == 'refs/heads/codex/mcp-sdk-20260929' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mcp-upgrade-prepared
          path: /tmp/prepared
      - name: Stage only the reviewed upgrade paths
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/prepared/implementation.patch
          python3 - <<'PY'
          import subprocess
          allowed = {
              'go.mod', 'go.sum', 'Makefile',
              'internal/mcp/calllog/service_test.go',
              'internal/mcp/memory/plugins/pageindex/pdf_parser.go',
              'internal/mcp/memory/plugins/pageindex/testdata_helper_test.go',
              'internal/web/generated.go', 'internal/library/models/models.go',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit('Refusing unexpected paths: ' + ', '.join(sorted(unexpected)))
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): refresh Go modules and adapt PDF and pgx APIs'
      - name: Fast-forward only the isolated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' \
            push https://github.com/Laisky/laisky-blog-graphql.git HEAD:refs/heads/codex/mcp-sdk-20260929
          git rev-parse HEAD
