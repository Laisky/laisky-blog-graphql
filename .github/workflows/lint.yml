name: Linter

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install pinned import formatter
        run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - name: Verify formatting without rewriting source
        run: ./.scripts/check_go_format.sh
      - name: Validate fail-closed gate controls
        run: python3 .scripts/test_fast_ci.py
      - name: Formatting and essential unit tests
        run: python3 .scripts/fast_ci.py --evidence /tmp/fast-unit
      - name: Keep reviewed source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-unit-receipts
          path: /tmp/fast-unit
          if-no-files-found: warn
          retention-days: 7
