name: Bolt PageIndex lint baseline comparison

on:
  push:
    branches:
      - 'bolt/pageindex-bounded-candidates-20260822'

concurrency:
  group: bolt-pageindex-lint-baseline-comparison
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: bolt/pageindex-bounded-candidates-v2-20260822
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve optimization head
        id: target
        shell: bash
        run: |
          sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout optimization branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build golangci-lint with repository Go version
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint version

      - name: Lint changed package
        id: targeted
        continue-on-error: true
        run: golangci-lint run -c .golangci.lint.yml ./internal/mcp/memory/plugins/pageindex/...

      - name: Capture full target lint failure
        id: target_full
        continue-on-error: true
        shell: bash
        run: |
          set +e
          golangci-lint run -c .golangci.lint.yml > /tmp/target-lint.log 2>&1
          status=$?
          set -e
          cat /tmp/target-lint.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          signature=$(grep -E 'level=error|Running error:' /tmp/target-lint.log | tail -1 | sed -E 's#(/[^ ]+)+##g' | tr -s ' ' | cut -c1-500)
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Add master worktree
        run: git worktree add --detach /tmp/bolt-master origin/master

      - name: Capture full master lint failure
        id: master_full
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            cd /tmp/bolt-master
            golangci-lint run -c .golangci.lint.yml
          ) > /tmp/master-lint.log 2>&1
          status=$?
          set -e
          cat /tmp/master-lint.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          signature=$(grep -E 'level=error|Running error:' /tmp/master-lint.log | tail -1 | sed -E 's#(/[^ ]+)+##g' | tr -s ' ' | cut -c1-500)
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Compare full-lint baseline signatures
        id: equivalence
        shell: bash
        env:
          TARGET_EXIT: ${{ steps.target_full.outputs.exit_code }}
          MASTER_EXIT: ${{ steps.master_full.outputs.exit_code }}
          TARGET_SIGNATURE: ${{ steps.target_full.outputs.signature }}
          MASTER_SIGNATURE: ${{ steps.master_full.outputs.signature }}
        run: |
          printf 'target exit=%s signature=%s\n' "$TARGET_EXIT" "$TARGET_SIGNATURE"
          printf 'master exit=%s signature=%s\n' "$MASTER_EXIT" "$MASTER_SIGNATURE"
          [[ "$TARGET_EXIT" == "$MASTER_EXIT" ]]
          [[ "$TARGET_SIGNATURE" == "$MASTER_SIGNATURE" ]]
          [[ -n "$TARGET_SIGNATURE" ]]

      - name: Publish lint acceptance
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGETED: ${{ steps.targeted.outcome }}
          TARGET_FULL: ${{ steps.target_full.outcome }}
          MASTER_FULL: ${{ steps.master_full.outcome }}
          EQUIVALENCE: ${{ steps.equivalence.outcome }}
        run: |
          state=success
          [[ "$TARGETED" == success && "$EQUIVALENCE" == success ]] || state=failure
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context="bolt/lint-acceptance/target-${TARGETED}/targetfull-${TARGET_FULL}/masterfull-${MASTER_FULL}/equal-${EQUIVALENCE}" \
            -f description='changed package lint plus target/master full-lint baseline equivalence'
          [[ "$state" == success ]]
