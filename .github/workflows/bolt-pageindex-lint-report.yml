name: Bolt PageIndex lint component diagnostics

on:
  push:
    branches:
      - 'bolt/pageindex-bounded-candidates-20260822'

concurrency:
  group: bolt-pageindex-lint-component-diagnostics
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: bolt/pageindex-bounded-candidates-v2-20260822
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve optimization head
        id: target
        shell: bash
        run: |
          sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout optimization branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint tools with Go 1.27
        id: tools
        continue-on-error: true
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint version

      - name: Run goimports
        id: goimports
        continue-on-error: true
        run: goimports -local github.com/Laisky/laisky-blog-graphql -w .

      - name: Run go mod tidy
        id: tidy
        continue-on-error: true
        run: go mod tidy

      - name: Run gofmt
        id: gofmt
        continue-on-error: true
        run: gofmt -s -w .

      - name: Run go vet
        id: vet
        continue-on-error: true
        run: go vet ./...

      - name: Run golangci-lint and publish exact diagnostics
        id: golangci
        continue-on-error: true
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          output=$(golangci-lint run -c .golangci.lint.yml 2>&1)
          lint_status=$?
          set -e
          printf '%s\n' "$output"

          issue_count=0
          while IFS= read -r issue; do
            [[ -n "$issue" ]] || continue
            file=$(printf '%s' "$issue" | cut -d: -f1)
            line=$(printf '%s' "$issue" | cut -d: -f2)
            base=$(basename "$file" | tr -cd '[:alnum:]_.-')
            linter=$(printf '%s' "$issue" | sed -n 's/.*(\([^()]\+\))$/\1/p' | tr -cd '[:alnum:]_.-')
            [[ -n "$linter" ]] || linter=unknown
            context=$(printf 'bolt/current-lint/%s/%s/%s' "$base" "$line" "$linter" | cut -c1-100)
            description=$(printf '%s' "$issue" | cut -c1-140)
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=failure \
              -f context="$context" \
              -f description="$description"
            issue_count=$((issue_count + 1))
          done < <(printf '%s\n' "$output" | grep -E '^[^:]+:[0-9]+:[0-9]+:' | head -30)

          if [[ "$lint_status" -ne 0 && "$issue_count" -eq 0 ]]; then
            while IFS= read -r diagnostic; do
              [[ -n "$diagnostic" ]] || continue
              slug=$(printf '%s' "$diagnostic" \
                | tr '[:upper:]' '[:lower:]' \
                | tr -cd '[:alnum:] _.-' \
                | tr ' _.' '-' \
                | sed 's/-\+/-/g; s/^-//; s/-$//' \
                | cut -c1-68)
              [[ -n "$slug" ]] || continue
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
                -f state=failure \
                -f context="bolt/current-lint/error/${slug}" \
                -f description="$(printf '%s' "$diagnostic" | cut -c1-140)"
            done < <(printf '%s\n' "$output" | tail -12)
          fi
          exit "$lint_status"

      - name: Run govulncheck
        id: vuln
        continue-on-error: true
        run: govulncheck ./...

      - name: Enforce pure-Go invariant
        id: pure
        continue-on-error: true
        run: ./.scripts/check_pure_go.sh

      - name: Enforce system-owner invariant
        id: owner
        continue-on-error: true
        run: ./.scripts/check_system_owner.sh

      - name: Publish component summary
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TOOLS: ${{ steps.tools.outcome }}
          GOIMPORTS: ${{ steps.goimports.outcome }}
          TIDY: ${{ steps.tidy.outcome }}
          GOFMT: ${{ steps.gofmt.outcome }}
          VET: ${{ steps.vet.outcome }}
          GOLANGCI: ${{ steps.golangci.outcome }}
          VULN: ${{ steps.vuln.outcome }}
          PURE: ${{ steps.pure.outcome }}
          OWNER: ${{ steps.owner.outcome }}
        run: |
          state=success
          for outcome in "$TOOLS" "$GOIMPORTS" "$TIDY" "$GOFMT" "$VET" "$GOLANGCI" "$VULN" "$PURE" "$OWNER"; do
            [[ "$outcome" == success ]] || state=failure
          done
          context="bolt/lint-components/t-${TOOLS}/i-${GOIMPORTS}/d-${TIDY}/f-${GOFMT}/v-${VET}/g-${GOLANGCI}/u-${VULN}/p-${PURE}/o-${OWNER}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context="${context:0:100}" \
            -f description='isolated make lint component outcomes'
          [[ "$state" == success ]]
