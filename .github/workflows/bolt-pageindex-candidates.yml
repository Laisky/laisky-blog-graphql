name: Bolt PageIndex candidate benchmark

on:
  push:
    branches:
      - 'bolt/pageindex-bounded-candidates-20260822'

permissions:
  contents: read
  statuses: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Candidate behavior tests
        id: behavior
        continue-on-error: true
        run: >-
          go test ./internal/mcp/memory/plugins/pageindex
          -run '^(TestFilterCandidatesLimitedMatchesFullSort|TestSearcherRunCandidateLimitKeepsLexicalFirstDocuments)$'
          -count=1

      - name: Candidate benchmark
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          output=$(go test ./internal/mcp/memory/plugins/pageindex \
            -run '^$' \
            -bench '^BenchmarkFilterCandidatesLimited100K$' \
            -benchmem \
            -count=10 2>&1)
          printf '%s\n' "$output"
          parsed=$(printf '%s\n' "$output" | awk '
            /^BenchmarkFilterCandidatesLimited100K-/ {
              samples = samples (samples == "" ? "" : ",") $3
              bytes = $5
              allocs = $7
              count++
            }
            END {
              if (count != 10) exit 1
              print samples "|" bytes "|" allocs
            }
          ')
          IFS='|' read -r samples bytes allocs <<< "$parsed"
          echo "samples=$samples" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "allocs=$allocs" >> "$GITHUB_OUTPUT"

      - name: Publish benchmark statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          TIME_SAMPLES: ${{ steps.benchmark.outputs.samples }}
          BYTES_PER_OP: ${{ steps.benchmark.outputs.bytes }}
          ALLOCS_PER_OP: ${{ steps.benchmark.outputs.allocs }}
        shell: bash
        run: |
          state=success
          if [[ "$BEHAVIOR_OUTCOME" != success || "$BENCHMARK_OUTCOME" != success ]]; then
            state=failure
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='bolt/candidate-baseline' \
            -f description="behavior=$BEHAVIOR_OUTCOME benchmark=$BENCHMARK_OUTCOME"
          if [[ "$BENCHMARK_OUTCOME" == success ]]; then
            IFS=',' read -ra samples <<< "$TIME_SAMPLES"
            first=$(IFS=,; echo "${samples[*]:0:5}")
            second=$(IFS=,; echo "${samples[*]:5:5}")
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="bolt/time-1/$first" \
              -f description='first five ns/op samples'
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="bolt/time-2/$second" \
              -f description='last five ns/op samples'
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="bolt/memory/$BYTES_PER_OP/$ALLOCS_PER_OP" \
              -f description='bytes/op and allocs/op'
          fi
          [[ "$state" == success ]]

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint tools
        id: tools
        continue-on-error: true
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install golangci-lint
        id: golangci
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Format and lint
        id: lint
        continue-on-error: true
        run: make lint

      - name: Ensure lint did not rewrite tracked files
        id: clean
        continue-on-error: true
        run: git diff --exit-code

      - name: Race and coverage suite
        id: race
        continue-on-error: true
        run: go test -race -cover ./...

      - name: Full benchmark suite
        id: fullbench
        continue-on-error: true
        run: go test -bench ./...

      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          GOLANGCI_OUTCOME: ${{ steps.golangci.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          RACE_OUTCOME: ${{ steps.race.outcome }}
          BENCH_OUTCOME: ${{ steps.fullbench.outcome }}
        shell: bash
        run: |
          state=success
          for outcome in "$TOOLS_OUTCOME" "$GOLANGCI_OUTCOME" "$LINT_OUTCOME" "$CLEAN_OUTCOME" "$RACE_OUTCOME" "$BENCH_OUTCOME"; do
            if [[ "$outcome" != success ]]; then
              state=failure
            fi
          done
          short() {
            if [[ "$1" == success ]]; then
              printf s
            else
              printf f
            fi
          }
          context="bolt/validation/t-$(short "$TOOLS_OUTCOME")/g-$(short "$GOLANGCI_OUTCOME")/l-$(short "$LINT_OUTCOME")/c-$(short "$CLEAN_OUTCOME")/r-$(short "$RACE_OUTCOME")/b-$(short "$BENCH_OUTCOME")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description='t=tools g=golangci l=lint c=clean r=race b=bench'
          [[ "$state" == success ]]
