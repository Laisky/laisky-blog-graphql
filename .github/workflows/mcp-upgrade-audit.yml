name: MCP upgrade lint audit

on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths: ['.github/workflows/mcp-upgrade-audit.yml']

permissions:
  contents: read

jobs:
  lint:
    name: lint-${{ matrix.revision }}
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'c31b0bec36935bea60f7553adc428d914e61c327' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install audit tools
        id: tools
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          mkdir -p /tmp/mcp-audit
          go version > /tmp/mcp-audit/tool-versions.txt
          golangci-lint version >> /tmp/mcp-audit/tool-versions.txt
      - name: Run repository make lint
        shell: bash
        run: |
          set +e
          make lint > /tmp/mcp-audit/lint.log 2>&1
          status=$?
          tail -100 /tmp/mcp-audit/lint.log
          exit "$status"
      - name: Audit reachable Go vulnerabilities independently
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          govulncheck ./... > /tmp/mcp-audit/vulnerabilities.log 2>&1
          status=$?
          cat /tmp/mcp-audit/vulnerabilities.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-lint-${{ matrix.revision }}
          path: /tmp/mcp-audit/
          retention-days: 7
