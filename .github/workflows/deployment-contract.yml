name: deployment-contract

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/deployment-contract.yml'
      - '.scripts/test_deploy_workflow.py'
      - '.scripts/prepare_browser_sentry.py'
      - '.scripts/test_browser_sentry_build_args.py'
      - '.scripts/requirements-deployment-tests.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gitignore'
      - 'go.mod'
      - 'go.sum'
      - '.scripts/test_docker_build_identity.py'
      - 'library/crawlercapture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install workflow test dependency
        run: python3 -m pip install --disable-pip-version-check -r .scripts/requirements-deployment-tests.txt
      - name: Deployment status, image verification and rollback contracts
        run: |
          python3 .scripts/test_deploy_workflow.py
          python3 .scripts/test_browser_sentry_build_args.py

  build-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Real sanitized Docker context and compiled capture identity
        run: python3 .scripts/test_docker_build_identity.py -v
