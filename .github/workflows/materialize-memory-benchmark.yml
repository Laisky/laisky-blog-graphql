name: materialize-memory-benchmark

on:
  push:
    branches:
      - agent/memory-benchmark-framework
    paths:
      - '.memory-benchmark-patch.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          ref: agent/memory-benchmark-framework
          fetch-depth: 0

      - name: Materialize reviewed patch
        run: |
          set -euo pipefail
          test -s .memory-benchmark-patch.ready
          cat .memory-benchmark-patch.part-* > .memory-benchmark-patch.tgz.b64
          base64 --decode .memory-benchmark-patch.tgz.b64 > /tmp/memory-benchmark-patch.tgz
          printf '%s  %s\n' 'd99c48f22a987732fb0ce4df5e60c1d7341fc687c643b9d2bcfdcd2cafd08fff' /tmp/memory-benchmark-patch.tgz | sha256sum --check
          tar -xzf /tmp/memory-benchmark-patch.tgz
          rm -f .memory-benchmark-patch.ready .memory-benchmark-patch.part-* .memory-benchmark-patch.tgz.b64
          rm -f .github/workflows/materialize-memory-benchmark.yml
          gofmt -w ./internal/mcp/memory/benchmark ./cmd/memory-bench
          git diff --check

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate generated implementation
        run: |
          set -euo pipefail
          go test -race -cover ./internal/mcp/memory/benchmark ./cmd/memory-bench
          go vet ./internal/mcp/memory/benchmark ./cmd/memory-bench
          for plugin in rag pageindex; do
            go run ./cmd/memory-bench \
              --backend=inprocess \
              --plugin="$plugin" \
              --dataset=tests/eval/memory_bench_smoke.jsonl \
              --format=canonical \
              --top-k=5 \
              --min-score=0.20 \
              --concurrency=1 \
              --warmup=1 \
              --repetitions=1 \
              --seed=42 \
              --index-timeout=15s \
              --poll-interval=50ms \
              --run-timeout=5m \
              --out="/tmp/memory-benchmark-$plugin"
          done

      - name: Commit materialized patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mcp): complete quantitative memory benchmark framework'
          git push origin HEAD:agent/memory-benchmark-framework
