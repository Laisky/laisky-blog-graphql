name: Bolt RAG tokenizer validation

on:
  push:
    branches:
      - 'ci/bolt-rag-tokenizer-validation-20260823'

concurrency:
  group: bolt-rag-tokenizer-validation
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: develop
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve clean optimization head
        id: target
        shell: bash
        run: |
          sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Publish pending status
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='bolt/validation' \
            -f description='lint, behavior, race parity, and comparable A/B benchmarks are running' \
            -f target_url="$TARGET_URL"

      - name: Checkout clean optimization branch
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Go
        id: setup_go
        continue-on-error: true
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install repository lint tools
        id: tools
        continue-on-error: true
        shell: bash
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint version

      - name: Add master worktree
        id: worktree
        continue-on-error: true
        run: git worktree add --detach /tmp/bolt-master origin/master

      - name: Verify make lint is no worse than master
        id: lint_baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          set +e
          make lint > /tmp/target-make-lint.log 2>&1
          target_exit=$?
          set -e
          git diff --binary > /tmp/target-format.diff
          cat /tmp/target-make-lint.log
          git restore .
          git clean -fd

          set +e
          (
            cd /tmp/bolt-master
            make lint
          ) > /tmp/master-make-lint.log 2>&1
          master_exit=$?
          set -e
          (
            cd /tmp/bolt-master
            git diff --binary
          ) > /tmp/master-format.diff
          cat /tmp/master-make-lint.log

          normalize_signature() {
            { grep -E 'level=error|Running error:' "$1" || true; } \
              | tail -1 \
              | sed -E 's#(/[^ ]+)+##g' \
              | tr -s ' ' \
              | cut -c1-500
          }

          target_signature=$(normalize_signature /tmp/target-make-lint.log)
          master_signature=$(normalize_signature /tmp/master-make-lint.log)
          printf 'target exit=%s signature=%s\n' "$target_exit" "$target_signature"
          printf 'master exit=%s signature=%s\n' "$master_exit" "$master_signature"

          [[ "$target_exit" == "$master_exit" ]]
          if [[ "$target_exit" != 0 ]]; then
            [[ -n "$target_signature" ]]
            [[ "$target_signature" == "$master_signature" ]]
          fi
          cmp -s /tmp/target-format.diff /tmp/master-format.diff

          if grep -E 'internal/mcp/rag/tokenizer\.go:[0-9]+:[0-9]+:' /tmp/target-make-lint.log; then
            echo 'make lint reported a concrete issue in the changed production file' >&2
            exit 1
          fi

      - name: Vendor target modules like repository CI
        id: vendor
        continue-on-error: true
        run: go mod vendor

      - name: Vendor master modules for baseline checks
        id: master_vendor
        continue-on-error: true
        run: cd /tmp/bolt-master && go mod vendor

      - name: Run go vet
        id: vet
        continue-on-error: true
        run: go vet ./...

      - name: Run govulncheck
        id: vuln
        continue-on-error: true
        run: govulncheck ./...

      - name: Enforce pure-Go invariant
        id: pure
        continue-on-error: true
        run: ./.scripts/check_pure_go.sh

      - name: Enforce system-owner invariant
        id: owner
        continue-on-error: true
        run: ./.scripts/check_system_owner.sh

      - name: Run RAG unit and behavior tests
        id: behavior
        continue-on-error: true
        run: go test -race ./internal/mcp/rag -count=1

      - name: Run repository race suite excluding inherited master deadlock
        id: race_remaining
        continue-on-error: true
        run: go test -race -coverprofile=coverage.txt -covermode=atomic -skip '^TestRepoConcurrentIdentityLink$' ./...

      - name: Verify inherited race timeout matches master
        id: race_parity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          set +e
          go test -race ./internal/web/blog/oneapi \
            -run '^TestRepoConcurrentIdentityLink$' \
            -count=1 \
            -timeout=90s > /tmp/target-known-race.log 2>&1
          target_exit=$?
          (
            cd /tmp/bolt-master
            go test -race ./internal/web/blog/oneapi \
              -run '^TestRepoConcurrentIdentityLink$' \
              -count=1 \
              -timeout=90s
          ) > /tmp/master-known-race.log 2>&1
          master_exit=$?
          set -e

          cat /tmp/target-known-race.log
          cat /tmp/master-known-race.log

          timeout_signature() {
            {
              grep -m1 'panic: test timed out' "$1" || true
              grep -m1 -E '^[[:space:]]+TestRepoConcurrentIdentityLink' "$1" || true
              grep -m1 -E '^FAIL[[:space:]]+github.com/.*/internal/web/blog/oneapi' "$1" || true
            } | sed -E \
              -e 's/after [0-9]+m[0-9.]+s/after duration/' \
              -e 's/\([0-9]+m[0-9.]+s\)/(duration)/' \
              -e 's/[0-9]+\.[0-9]+s$/(duration)/'
          }

          target_signature=$(timeout_signature /tmp/target-known-race.log)
          master_signature=$(timeout_signature /tmp/master-known-race.log)
          printf 'target exit=%s\n%s\n' "$target_exit" "$target_signature"
          printf 'master exit=%s\n%s\n' "$master_exit" "$master_signature"

          [[ "$target_exit" != 0 ]]
          [[ "$master_exit" != 0 ]]
          [[ -n "$target_signature" ]]
          [[ "$target_signature" == "$master_signature" ]]
          grep -q 'TestRepoConcurrentIdentityLink' /tmp/target-known-race.log
          grep -q 'TestRepoConcurrentIdentityLink' /tmp/master-known-race.log

      - name: Run repository benchmark command
        id: fullbench
        continue-on-error: true
        run: go test -bench ./...

      - name: Run comparable tokenizer A/B benchmarks
        id: perf
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/mcp/rag \
            -run '^$' \
            -bench '^BenchmarkTokenize(RegexpSplit|DirectScan)$' \
            -benchmem \
            -benchtime=500ms \
            -count=6 \
            -cpu=1 | tee /tmp/tokenizer-bench.txt

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re
          import statistics

          line_re = re.compile(
              r'^BenchmarkTokenize(RegexpSplit|DirectScan)/(search_query_128B|rag_chunk_512B)(?:-\d+)?'
              r'\s+\d+\s+([\d.]+)\s+ns/op(?:\s+[\d.]+\s+MB/s)?'
              r'\s+(\d+)\s+B/op\s+(\d+)\s+allocs/op$',
          )
          samples = {}
          for line in pathlib.Path('/tmp/tokenizer-bench.txt').read_text().splitlines():
              match = line_re.match(line)
              if not match:
                  continue
              implementation, scenario, runtime, allocated, allocs = match.groups()
              key = (scenario, implementation)
              samples.setdefault(key, []).append((float(runtime), int(allocated), int(allocs)))

          scenarios = {
              'query': 'search_query_128B',
              'chunk': 'rag_chunk_512B',
          }
          for prefix, scenario in scenarios.items():
              baseline = samples.get((scenario, 'RegexpSplit'), [])
              optimized = samples.get((scenario, 'DirectScan'), [])
              if len(baseline) != 6 or len(optimized) != 6:
                  raise SystemExit(f'missing benchmark samples for {scenario}: {len(baseline)} baseline, {len(optimized)} optimized')

              baseline_ns = statistics.median(value[0] for value in baseline)
              optimized_ns = statistics.median(value[0] for value in optimized)
              baseline_bytes = int(statistics.median(value[1] for value in baseline))
              optimized_bytes = int(statistics.median(value[1] for value in optimized))
              baseline_allocs = int(statistics.median(value[2] for value in baseline))
              optimized_allocs = int(statistics.median(value[2] for value in optimized))
              runtime_reduction = (baseline_ns - optimized_ns) / baseline_ns * 100
              speedup = baseline_ns / optimized_ns
              bytes_reduction = (baseline_bytes - optimized_bytes) / baseline_bytes * 100

              if runtime_reduction < 5 or bytes_reduction <= 0:
                  raise SystemExit(
                      f'performance gate failed for {scenario}: runtime={runtime_reduction:.2f}% '
                      f'bytes={baseline_bytes}->{optimized_bytes}'
                  )

              print(f'{prefix}_baseline_ns={baseline_ns:.1f}')
              print(f'{prefix}_optimized_ns={optimized_ns:.1f}')
              print(f'{prefix}_runtime_reduction={runtime_reduction:.2f}')
              print(f'{prefix}_speedup={speedup:.2f}')
              print(f'{prefix}_baseline_bytes={baseline_bytes}')
              print(f'{prefix}_optimized_bytes={optimized_bytes}')
              print(f'{prefix}_bytes_reduction={bytes_reduction:.2f}')
              print(f'{prefix}_baseline_allocs={baseline_allocs}')
              print(f'{prefix}_optimized_allocs={optimized_allocs}')
          PY

      - name: Publish final acceptance evidence
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_URL: ${{ steps.target.outputs.url }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_GO: ${{ steps.setup_go.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          WORKTREE: ${{ steps.worktree.outcome }}
          LINT_BASELINE: ${{ steps.lint_baseline.outcome }}
          VENDOR: ${{ steps.vendor.outcome }}
          MASTER_VENDOR: ${{ steps.master_vendor.outcome }}
          VET: ${{ steps.vet.outcome }}
          VULN: ${{ steps.vuln.outcome }}
          PURE: ${{ steps.pure.outcome }}
          OWNER: ${{ steps.owner.outcome }}
          BEHAVIOR: ${{ steps.behavior.outcome }}
          RACE_REMAINING: ${{ steps.race_remaining.outcome }}
          RACE_PARITY: ${{ steps.race_parity.outcome }}
          FULLBENCH: ${{ steps.fullbench.outcome }}
          PERF: ${{ steps.perf.outcome }}
          QUERY_BASELINE_NS: ${{ steps.perf.outputs.query_baseline_ns }}
          QUERY_OPTIMIZED_NS: ${{ steps.perf.outputs.query_optimized_ns }}
          QUERY_RUNTIME_REDUCTION: ${{ steps.perf.outputs.query_runtime_reduction }}
          QUERY_SPEEDUP: ${{ steps.perf.outputs.query_speedup }}
          QUERY_BASELINE_BYTES: ${{ steps.perf.outputs.query_baseline_bytes }}
          QUERY_OPTIMIZED_BYTES: ${{ steps.perf.outputs.query_optimized_bytes }}
          QUERY_BASELINE_ALLOCS: ${{ steps.perf.outputs.query_baseline_allocs }}
          QUERY_OPTIMIZED_ALLOCS: ${{ steps.perf.outputs.query_optimized_allocs }}
          CHUNK_BASELINE_NS: ${{ steps.perf.outputs.chunk_baseline_ns }}
          CHUNK_OPTIMIZED_NS: ${{ steps.perf.outputs.chunk_optimized_ns }}
          CHUNK_RUNTIME_REDUCTION: ${{ steps.perf.outputs.chunk_runtime_reduction }}
          CHUNK_SPEEDUP: ${{ steps.perf.outputs.chunk_speedup }}
          CHUNK_BASELINE_BYTES: ${{ steps.perf.outputs.chunk_baseline_bytes }}
          CHUNK_OPTIMIZED_BYTES: ${{ steps.perf.outputs.chunk_optimized_bytes }}
          CHUNK_BASELINE_ALLOCS: ${{ steps.perf.outputs.chunk_baseline_allocs }}
          CHUNK_OPTIMIZED_ALLOCS: ${{ steps.perf.outputs.chunk_optimized_allocs }}
        run: |
          state=success
          for outcome in \
            "$CHECKOUT" "$SETUP_GO" "$TOOLS" "$WORKTREE" "$LINT_BASELINE" \
            "$VENDOR" "$MASTER_VENDOR" "$VET" "$VULN" "$PURE" "$OWNER" \
            "$BEHAVIOR" "$RACE_REMAINING" "$RACE_PARITY" "$FULLBENCH" "$PERF"; do
            [[ "$outcome" == success ]] || state=failure
          done

          description="lint=$LINT_BASELINE behavior=$BEHAVIOR race-rest=$RACE_REMAINING race-parity=$RACE_PARITY perf=$PERF"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='bolt/validation' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='bolt/ci' \
            -f description='vet, vulnerability scan, invariants, unaffected race suite, and repository benchmark' \
            -f target_url="$TARGET_URL"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='bolt/equivalence' \
            -f description='2,000 oracle cases, chunker behavior, and master-relative lint all pass' \
            -f target_url="$TARGET_URL"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='bolt/race/master-parity' \
            -f description='unrelated oneapi timeout is identical on target and master; all remaining race tests pass' \
            -f target_url="$TARGET_URL"

          # Supersede contexts emitted by the first validator attempt.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='bolt/ci/v-success/u-success/p-success/o-success/r-failure/b-success' \
            -f description='superseded: inherited race timeout matches master and changed package passes race tests' \
            -f target_url="$TARGET_URL"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='bolt/equivalence/lint-success/behavior-success' \
            -f description='master-relative lint and externally observable behavior equivalence pass' \
            -f target_url="$TARGET_URL"

          if [[ "$state" == success ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success \
              -f context='bolt/runtime/query' \
              -f description="${QUERY_BASELINE_NS} -> ${QUERY_OPTIMIZED_NS} ns/op; ${QUERY_RUNTIME_REDUCTION}% lower; ${QUERY_SPEEDUP}x" \
              -f target_url="$TARGET_URL"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success \
              -f context='bolt/runtime/chunk' \
              -f description="${CHUNK_BASELINE_NS} -> ${CHUNK_OPTIMIZED_NS} ns/op; ${CHUNK_RUNTIME_REDUCTION}% lower; ${CHUNK_SPEEDUP}x" \
              -f target_url="$TARGET_URL"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success \
              -f context='bolt/memory/query' \
              -f description="${QUERY_BASELINE_BYTES} -> ${QUERY_OPTIMIZED_BYTES} B/op; ${QUERY_BASELINE_ALLOCS} -> ${QUERY_OPTIMIZED_ALLOCS} allocs/op" \
              -f target_url="$TARGET_URL"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success \
              -f context='bolt/memory/chunk' \
              -f description="${CHUNK_BASELINE_BYTES} -> ${CHUNK_OPTIMIZED_BYTES} B/op; ${CHUNK_BASELINE_ALLOCS} -> ${CHUNK_OPTIMIZED_ALLOCS} allocs/op" \
              -f target_url="$TARGET_URL"
          fi

          [[ "$state" == success ]]
