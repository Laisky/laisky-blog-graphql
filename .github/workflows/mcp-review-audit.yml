name: MCP review validation audit

on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths:
      - 'internal/mcp/**'
      - '.github/workflows/mcp-review-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [baseline, review]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'baseline' && '02e9e3850f385f12c93ce33b1b176180467f79f8' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Repeated session ownership acceptance
        if: matrix.target == 'review'
        run: go test -race -count=20 -timeout 5m ./internal/mcp -run TestMCPReview > /tmp/mcp-review-tests.log 2>&1
      - name: Install pinned lint tools
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          mkdir -p /tmp/mcp-lint-tools
          cd /tmp/mcp-lint-tools
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-checksums.txt
          sha256sum --check --ignore-missing golangci-lint-2.14.0-checksums.txt
          tar -xzf golangci-lint-2.14.0-linux-amd64.tar.gz
          echo /tmp/mcp-lint-tools/golangci-lint-2.14.0-linux-amd64 >> "$GITHUB_PATH"
      - name: Full make lint (existing baseline debt is not suppressed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          go version > /tmp/mcp-review-tool-versions.txt
          golangci-lint version >> /tmp/mcp-review-tool-versions.txt
          make lint > /tmp/mcp-review-lint.log 2>&1
      - name: Capture formatting changes
        if: always()
        run: git diff > /tmp/mcp-review-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-review-${{ matrix.target }}
          path: /tmp/mcp-review-*
          retention-days: 7
