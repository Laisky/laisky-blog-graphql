name: ci

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'test/ci'
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - 'tests/**'
      - 'test/**'
      - 'ci/**'

jobs:
  check_skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check if CI should be skipped
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" =~ ^(docs:|doc:|tests:|test:|ci:) ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping CI due to commit message prefix"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  build_latest:
    needs: check_skip
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build_latest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push (latest + hash)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ppcelery/laisky-blog-graphql:latest
            ppcelery/laisky-blog-graphql:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha

  build_latest_cache:
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build_latest_cache-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export cache only
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    concurrency:
      group: deploy-b1
      cancel-in-progress: false
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_HOST_USERNAME }}
          password: ${{ secrets.TARGET_HOST_PASSWORD }}
          port: ${{ secrets.TARGET_HOST_SSH_PORT }}
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            cd /home/laisky/repo/VPS
            image=ppcelery/laisky-blog-graphql:latest
            rollback_image=ppcelery/laisky-blog-graphql:rollback-ci-${{ github.run_id }}
            compose=(docker compose -f b1-docker-compose.yml)

            # Fail before changing image tags or containers; never fall back to v1.
            docker compose version
            "${compose[@]}" config --quiet
            previous_container=$("${compose[@]}" ps -q graphql)
            previous_image=
            if [[ -n "$previous_container" ]]; then
              [[ "$previous_container" != *$'\n'* ]]
              previous_image=$(docker inspect --format '{{.Image}}' "$previous_container")
              docker tag "$previous_image" "$rollback_image"
            fi

            docker pull "$image"
            expected_image=$(docker image inspect --format '{{.Id}}' "$image")

            verify_image() {
              local container actual running
              container=$("${compose[@]}" ps -q graphql) || return $?
              [[ -n "$container" && "$container" != *$'\n'* ]] || return 1
              actual=$(docker inspect --format '{{.Image}}' "$container") || return $?
              running=$(docker inspect --format '{{.State.Running}}' "$container") || return $?
              [[ "$actual" == "$1" && "$running" == true ]]
            }

            rollback() {
              local deploy_status=$1 rollback_status
              echo "Deployment failed (exit $deploy_status)." >&2
              if [[ -z "$previous_image" ]]; then
                echo 'No previous container; automatic rollback is unavailable.' >&2
              elif docker tag "$previous_image" "$image" &&
                "${compose[@]}" up -d --no-deps --pull never --force-recreate --wait --wait-timeout 120 graphql &&
                verify_image "$previous_image"; then
                echo "Rollback restored the previous image; retained as $rollback_image." >&2
              else
                rollback_status=$?
                echo "Rollback failed (exit $rollback_status); saved image: $rollback_image." >&2
              fi
              # Diagnostics and even a successful rollback must not turn a failed deploy green.
              "${compose[@]}" ps graphql || true
              exit "$deploy_status"
            }

            # Recreate only GraphQL and verify the locally pulled image, without another pull.
            if "${compose[@]}" up -d --no-deps --pull never --force-recreate --wait --wait-timeout 120 graphql; then
              if verify_image "$expected_image"; then
                "${compose[@]}" ps graphql
              else
                rollback "$?"
              fi
            else
              rollback "$?"
            fi
            DEPLOY
