name: ci

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'test/ci'
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - 'tests/**'
      - 'test/**'
      - 'ci/**'

jobs:
  check_skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check if CI should be skipped
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" =~ ^(docs:|doc:|tests:|test:|ci:) ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping CI due to commit message prefix"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  build_latest:
    outputs:
      browser_sentry_build_args: ${{ steps.browser_sentry.outputs.build_args }}
    needs: check_skip
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build_latest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Prepare public MCP browser reporting arguments
        id: browser_sentry
        env:
          MCP_SENTRY_ENABLED: ${{ vars.MCP_SENTRY_ENABLED }}
          MCP_SENTRY_DSN: ${{ vars.MCP_SENTRY_DSN }}
          MCP_SENTRY_ENVIRONMENT: ${{ vars.MCP_SENTRY_ENVIRONMENT }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .scripts/prepare_browser_sentry.py --github-output "$GITHUB_OUTPUT"

      - name: Prepare public shallow Git build metadata
        run: python3 .scripts/prepare_docker_context.py

      - name: Build and push (latest + hash)
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: ${{ steps.browser_sentry.outputs.build_args }}
          push: true
          tags: |
            ppcelery/laisky-blog-graphql:latest
            ppcelery/laisky-blog-graphql:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha

  build_latest_cache:
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build_latest_cache-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare public shallow Git build metadata
        run: python3 .scripts/prepare_docker_context.py

      - name: Build and export cache only
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: ${{ needs.build_latest.outputs.browser_sentry_build_args }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    concurrency:
      group: deploy-b1
      cancel-in-progress: false
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_HOST_USERNAME }}
          password: ${{ secrets.TARGET_HOST_PASSWORD }}
          port: ${{ secrets.TARGET_HOST_SSH_PORT }}
          command_timeout: 15m
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            cd /home/laisky/repo/VPS
            image=ppcelery/laisky-blog-graphql:latest
            rollback_image=ppcelery/laisky-blog-graphql:rollback-ci-${{ github.run_id }}-${{ github.run_attempt }}
            compose=(docker compose -f b1-docker-compose.yml)

            # Fail before changing image tags or containers; never fall back to v1.
            docker compose version
            python3 --version >/dev/null
            timeout --version >/dev/null
            "${compose[@]}" config --quiet
            previous_container=$("${compose[@]}" ps -q graphql)
            previous_image=
            if [[ -n "$previous_container" ]]; then
              [[ "$previous_container" != *$'\n'* ]]
              previous_image=$(docker inspect --format '{{.Image}}' "$previous_container")
              docker tag "$previous_image" "$rollback_image"
            fi

            timeout 300 docker pull "$image"
            expected_image=$(docker image inspect --format '{{.Id}}' "$image")

            verify_ready() {
              local container current actual running address
              container=$("${compose[@]}" ps -q graphql) || return $?
              [[ -n "$container" && "$container" != *$'\n'* ]] || return 1
              actual=$(docker inspect --format '{{.Image}}' "$container") || return $?
              running=$(docker inspect --format '{{.State.Running}}' "$container") || return $?
              [[ "$actual" == "$1" && "$running" == true ]] || return 1
              # Probe this verified container directly, never a public proxy or the old container.
              address=$(docker inspect --format '{{(index .NetworkSettings.Networks "vps_default").IPAddress}}' "$container") || return $?
              python3 - "$address" <<'READINESS' || return $?
            import http.client
            import ipaddress
            import json
            import signal
            import sys
            import time
            import urllib.error
            import urllib.request

            budget_seconds = 60
            deadline = time.monotonic() + budget_seconds
            version = "2026-07-28"
            url = "http://" + str(ipaddress.IPv4Address(sys.argv[1])) + ":17800/.well-known/mcp"

            def expired(signum, frame):
                raise TimeoutError("readiness deadline")

            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, request, fp, code, message, headers, target):
                    return None

            def require(condition):
                if not condition:
                    raise ValueError("invalid MCP readiness response")

            signal.signal(signal.SIGALRM, expired)
            signal.setitimer(signal.ITIMER_REAL, budget_seconds)
            opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
            try:
                for attempt in range(31):
                    try:
                        for method in ("server/discover", "tools/list"):
                            remaining = deadline - time.monotonic()
                            require(remaining > 0)
                            payload = {"jsonrpc": "2.0", "id": 1, "method": method, "params": {"_meta": {
                                "io.modelcontextprotocol/protocolVersion": version,
                                "io.modelcontextprotocol/clientInfo": {"name": "release-check", "version": "1"},
                                "io.modelcontextprotocol/clientCapabilities": {},
                            }}}
                            request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={
                                "Content-Type": "application/json",
                                "Accept": "application/json, text/event-stream",
                                "Mcp-Protocol-Version": version,
                                "Mcp-Method": method,
                            })
                            with opener.open(request, timeout=min(5, remaining)) as response:
                                require(response.status == 200)
                                require(response.headers.get_content_type() == "application/json")
                                require("Mcp-Session-Id" not in response.headers)
                                raw = response.read(1024 * 1024 + 1)
                            require(len(raw) <= 1024 * 1024)
                            reply = json.loads(raw)
                            require(isinstance(reply, dict) and reply.get("jsonrpc") == "2.0")
                            require(type(reply.get("id")) is int and reply["id"] == 1 and "error" not in reply)
                            result = reply.get("result")
                            require(isinstance(result, dict) and result.get("resultType") == "complete")
                            if method == "server/discover":
                                versions = result.get("supportedVersions")
                                require(isinstance(versions, list) and version in versions)
                                name = result["_meta"]["io.modelcontextprotocol/serverInfo"]["name"]
                                require(isinstance(name, str) and bool(name.strip()))
                            else:
                                tools = result.get("tools")
                                require(isinstance(tools, list) and all(isinstance(tool, dict) for tool in tools))
                                require({"web_fetch", "web_search"} <= {tool.get("name") for tool in tools})
                                require(result.get("cacheScope") == "private")
                        break
                    except (OSError, ValueError, KeyError, TypeError, AttributeError, http.client.HTTPException):
                        remaining = deadline - time.monotonic()
                        if attempt == 30 or remaining <= 0:
                            print("MCP readiness failed.", file=sys.stderr)
                            sys.exit(1)
                        time.sleep(min(2, remaining))
            finally:
                signal.setitimer(signal.ITIMER_REAL, 0)
            READINESS
              # Fail if Compose selected another container, or this image/process changed during probing.
              current=$("${compose[@]}" ps -q graphql) || return $?
              actual=$(docker inspect --format '{{.Image}}' "$container") || return $?
              running=$(docker inspect --format '{{.State.Running}}' "$container") || return $?
              [[ "$current" == "$container" && "$actual" == "$1" && "$running" == true ]]
            }
            rollback() {
              local deploy_status=$1 rollback_status
              echo "Deployment failed (exit $deploy_status)." >&2
              if [[ -z "$previous_image" ]]; then
                echo 'No previous container; automatic rollback is unavailable.' >&2
              elif docker tag "$previous_image" "$image" &&
                "${compose[@]}" up -d --no-deps --pull never --force-recreate --wait --wait-timeout 120 graphql &&
                verify_ready "$previous_image"; then
                echo "Rollback restored the previous image; retained as $rollback_image." >&2
              else
                rollback_status=$?
                echo "Rollback failed (exit $rollback_status); saved image: $rollback_image." >&2
              fi
              # Diagnostics and even a successful rollback must not turn a failed deploy green.
              "${compose[@]}" ps graphql || true
              exit "$deploy_status"
            }

            # Recreate only GraphQL; require the pulled image and its MCP metadata readiness.
            if "${compose[@]}" up -d --no-deps --pull never --force-recreate --wait --wait-timeout 120 graphql; then
              if verify_ready "$expected_image"; then
                "${compose[@]}" ps graphql
              else
                rollback "$?"
              fi
            else
              rollback "$?"
            fi
            DEPLOY
