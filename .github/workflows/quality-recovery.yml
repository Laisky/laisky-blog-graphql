name: quality-recovery
on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths: ['.github/workflows/quality-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: quality-dependency-prepared
          run-id: 36617848513
          github-token: ${{ github.token }}
          path: /tmp/recovered-deps
      - name: Recover sources and candidate dependency locks
        run: |
          set -euo pipefail
          mkdir -p /tmp/quality-recovery
          git archive --format=tar.gz HEAD > /tmp/quality-recovery/original.tar.gz
          cp /tmp/recovered-deps/updated/go.mod go.mod
          cp /tmp/recovered-deps/updated/go.sum go.sum
          cp /tmp/recovered-deps/updated/web/package.json web/package.json
          cp /tmp/recovered-deps/updated/web/pnpm-lock.yaml web/pnpm-lock.yaml
          tar --exclude=.git -czf /tmp/quality-recovery/candidate.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: quality-recovered-sources
          path: /tmp/quality-recovery/
          retention-days: 7
      - name: Install pinned linter
        run: |
          set -euo pipefail
          mkdir -p /tmp/lint-tools
          cd /tmp/lint-tools
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-checksums.txt
          sha256sum --check --ignore-missing golangci-lint-2.14.0-checksums.txt
          tar -xzf golangci-lint-2.14.0-linux-amd64.tar.gz
          echo /tmp/lint-tools/golangci-lint-2.14.0-linux-amd64 >> "$GITHUB_PATH"
      - name: Collect all lint diagnostics without truncation
        run: golangci-lint run -c .golangci.lint.yml --timeout 10m --max-issues-per-linter=0 --max-same-issues=0 --output.json.path=/tmp/quality-recovery/lint.json > /tmp/quality-recovery/lint.log 2>&1
      - name: Dependency wire compatibility
        if: ${{ !cancelled() }}
        run: go test -race -count=1 -v -timeout 1m ./library/db/arweave > /tmp/quality-recovery/avro-test.log 2>&1
      - name: Reproduce remaining behavioral defects
        if: ${{ !cancelled() }}
        run: go test -race -count=1 -timeout 2m ./internal/web ./internal/web/telegram/controller > /tmp/quality-recovery/behavior.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-recovery-diagnostics
          path: |
            /tmp/quality-recovery/*.json
            /tmp/quality-recovery/*.log
          retention-days: 7
