name: fileio-project-picker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fileio-project-picker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend behavior tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test
      - name: Frontend lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm lint
      - name: Frontend production build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fileio_test
          POSTGRES_PASSWORD: fileio_test_only
          POSTGRES_DB: fileio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fileio_test -d fileio_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      FILEIO_TEST_POSTGRES_DSN: postgres://fileio_test:fileio_test_only@localhost:5432/fileio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Namespace SQL guard
        run: bash .scripts/check_system_owner.sh
      - name: FileIO and auth behavior tests with race detector
        run: go test -race -cover ./internal/mcp/files ./internal/mcp/auth
      - name: FileIO and auth vet
        if: ${{ !cancelled() }}
        run: go vet ./internal/mcp/files ./internal/mcp/auth
