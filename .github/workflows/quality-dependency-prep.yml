name: quality-dependency-prep
on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths: ['.github/workflows/quality-dependency-prep.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: quality-dependency-prepared
          run-id: 36616545960
          github-token: ${{ github.token }}
          path: /tmp/previous-quality-deps
      - name: Retain validated frontend locks and migrate to maintained codec
        run: |
          set -euo pipefail
          mkdir -p /tmp/quality-deps
          cp /tmp/previous-quality-deps/updated/go.mod go.mod
          cp /tmp/previous-quality-deps/updated/go.sum go.sum
          cp /tmp/previous-quality-deps/updated/web/package.json web/package.json
          cp /tmp/previous-quality-deps/updated/web/pnpm-lock.yaml web/pnpm-lock.yaml
          go get github.com/iskorotkov/avro/v2@v2.34.0
          go mod tidy
          go mod verify
          go build ./...
          go test -race -count=1 -timeout 1m ./library/db/arweave
          go list -deps ./... > /tmp/quality-deps/packages.txt
          if grep -E '^github.com/hamba/avro/v2($|/)|^golang.org/x/crypto/openpgp($|/)' /tmp/quality-deps/packages.txt; then
            echo 'An abandoned vulnerable implementation remains imported' >&2
            exit 1
          fi
      - name: Frontend compatibility
        if: ${{ !cancelled() }}
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build
      - name: Audit all frontend severities
        if: ${{ !cancelled() }}
        run: cd web && pnpm audit --json > /tmp/quality-deps/frontend-audit.json
      - name: Audit imported Go packages and reachable symbols
        if: ${{ !cancelled() }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck -scan package -show verbose ./... > /tmp/quality-deps/go-audit.txt 2>&1
          govulncheck ./... > /tmp/quality-deps/go-symbol-audit.txt 2>&1
      - name: Capture reviewed outputs
        if: always()
        run: |
          mkdir -p /tmp/quality-deps/updated/web
          cp go.mod go.sum /tmp/quality-deps/updated/
          cp web/package.json web/pnpm-lock.yaml /tmp/quality-deps/updated/web/
          git diff -- go.mod go.sum web/package.json web/pnpm-lock.yaml > /tmp/quality-deps/dependencies.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-dependency-prepared
          path: /tmp/quality-deps/
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mcp-sdk-20260929
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: quality-dependency-prepared
          path: /tmp/quality-deps
      - name: Publish validated locks without overwriting concurrent work
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cp /tmp/quality-deps/updated/go.mod go.mod
          cp /tmp/quality-deps/updated/go.sum go.sum
          cp /tmp/quality-deps/updated/web/package.json web/package.json
          cp /tmp/quality-deps/updated/web/pnpm-lock.yaml web/pnpm-lock.yaml
          git add -- go.mod go.sum web/package.json web/pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): remove vulnerable Go and frontend implementations'
          git push origin HEAD:refs/heads/codex/mcp-sdk-20260929
