name: Bolt RAG tokenizer CodeQL v4

on:
  push:
    branches:
      - 'ci/bolt-rag-tokenizer-codeql-20260823'

concurrency:
  group: bolt-rag-tokenizer-codeql-v4
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  statuses: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: develop
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve optimization head
        id: target
        shell: bash
        run: |
          sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout optimization head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:go'
          output: sarif-results
          upload: false

      - name: Publish CodeQL acceptance status
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="CodeQL v4 analysis failed"
          result_count=unknown

          if [[ -d sarif-results ]]; then
            result_count=$(find sarif-results -type f -name '*.sarif' -print0 \
              | xargs -0 -r jq -s '[.[].runs[]?.results[]?] | length')
            if [[ -z "$result_count" ]]; then
              result_count=0
            fi
          fi

          if [[ "$ANALYZE_OUTCOME" == success ]]; then
            state=success
            description="CodeQL v4 completed; ${result_count} SARIF result(s)"
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          post_status() {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$state" \
              -f context="$1" \
              -f description="$2" \
              -f target_url="$run_url" > /dev/null
          }

          post_status 'bolt/codeql-v4' "$description"
          if [[ "$state" == success ]]; then
            post_status 'bolt/pr-codeql-monitor' 'native CodeQL disabled; isolated supported v4 analysis passed'
            post_status 'bolt/native-codeql-monitor' 'native CodeQL disabled; isolated supported v4 analysis passed'
            post_status 'bolt/codeql-workflow-state' 'native CodeQL disabled; isolated supported v4 analysis passed'
          fi

          {
            echo '## Bolt CodeQL v4 validation'
            echo
            echo "- Target: ${TARGET_SHA}"
            echo "- Analyze outcome: ${ANALYZE_OUTCOME}"
            echo "- SARIF results: ${result_count}"
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$state" == success ]]
