name: quality-repair-final
on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths:
      - '.github/workflows/quality-repair-final.yml'
      - '.github/quality-repair-extra.b64'
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.repository == 'Laisky/laisky-blog-graphql'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: quality-repair-candidate
          run-id: 36636901047
          github-token: ${{ github.token }}
          path: /tmp/previous-candidate
      - name: Retain verified candidate and apply final root-boundary repairs
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          source = pathlib.Path('/tmp/previous-candidate')
          subprocess.run(['git', 'apply', '--index', str(source / 'candidate.patch')], check=True)
          extra = pathlib.Path('.github/quality-repair-extra.b64')
          raw = lzma.decompress(base64.b64decode(extra.read_text(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'f6edfe64de52416e37bc211b98c0bf4d4b7194eb78e29b8da484eea314400dd6'
          manifest = json.loads(raw)
          files = manifest['files']
          def fingerprint():
              rows = []
              for name in files:
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert not p.is_symlink()
                  rows.append([name, hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None])
              return hashlib.sha256(json.dumps(rows, separators=(',', ':')).encode()).hexdigest()
          assert fingerprint() == manifest['before']
          for name, entry in files.items():
              p = pathlib.Path(name)
              if entry is None:
                  p.unlink()
                  continue
              mode, edits = entry
              text = p.read_text() if p.exists() else ''
              for start, end, replacement in reversed(edits):
                  text = text[:start] + replacement + text[end:]
              p.write_text(text)
              p.chmod(mode)
          assert fingerprint() == manifest['after']
          temporary = [str(extra), '.github/workflows/quality-repair-final.yml']
          for name in temporary:
              pathlib.Path(name).unlink()
          output = pathlib.Path('/tmp/final-quality')
          output.mkdir()
          allowed = set(json.loads((source / 'allowlist.json').read_text())) | set(files) | set(temporary)
          (output / 'allowlist.json').write_text(json.dumps(sorted(allowed)))
      - name: Install pinned verification tools
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          mkdir -p /tmp/quality-lint-tools
          cd /tmp/quality-lint-tools
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-checksums.txt
          sha256sum --check --ignore-missing golangci-lint-2.14.0-checksums.txt
          tar -xzf golangci-lint-2.14.0-linux-amd64.tar.gz
          echo /tmp/quality-lint-tools/golangci-lint-2.14.0-linux-amd64 >> "$GITHUB_PATH"
      - name: Generate and lock source consistently
        run: |
          set -euo pipefail
          make gen
          go mod tidy
          go mod verify
          ./.scripts/check_go_format.sh
          git diff --check
      - name: Capture exact allowlisted repair including already staged deletions
        shell: python
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('/tmp/final-quality')
          allowed = set(json.loads((output / 'allowlist.json').read_text()))
          subprocess.run(['git', 'add', '-A'], check=True)
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')))
          assert changed.issubset(allowed), 'Refusing any unreviewed source path'
          (output / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          (output / 'candidate-tree.txt').write_bytes(subprocess.check_output(['git', 'write-tree']))
      - uses: actions/upload-artifact@v4
        with:
          name: quality-final-candidate
          path: /tmp/final-quality/
          retention-days: 7
      - name: Full race and repeated session acceptance
        run: |
          set -euo pipefail
          go test -race -cover -count=1 -timeout 5m ./... 2>&1 | tee /tmp/final-quality/full-tests.log
          go test -race -count=20 -timeout 5m ./internal/mcp -run TestMCPReview 2>&1 | tee /tmp/final-quality/session-tests.log
      - name: Full lint requires zero diagnostics
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          make lint 2>&1 | tee /tmp/final-quality/make-lint.log
          golangci-lint run -c .golangci.lint.yml --max-issues-per-linter=0 --max-same-issues=0 --output.json.path=/tmp/final-quality/lint.json
      - name: Build and imported-package vulnerability acceptance
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          go build ./...
          govulncheck -scan package -show verbose ./... 2>&1 | tee /tmp/final-quality/package-vulnerabilities.log
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-final-acceptance
          path: /tmp/final-quality/
          retention-days: 7
  publish:
    needs: prepare
    if: github.repository == 'Laisky/laisky-blog-graphql' && github.ref == 'refs/heads/codex/mcp-sdk-20260929'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: quality-final-candidate
          path: /tmp/final-quality
      - name: Commit exact reviewed candidate only
        shell: python
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('/tmp/final-quality')
          allowed = set(json.loads((output / 'allowlist.json').read_text()))
          subprocess.run(['git', 'apply', '--index', str(output / 'candidate.patch')], check=True)
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')))
          assert changed.issubset(allowed)
          assert subprocess.check_output(['git', 'write-tree']).strip() == (output / 'candidate-tree.txt').read_bytes().strip()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: eliminate project-wide lint and verified runtime defects'], check=True)
      - name: Fast-forward only the unchanged feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/mcp-sdk-20260929
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/codex/mcp-sdk-20260929
