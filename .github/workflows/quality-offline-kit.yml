name: quality-offline-kit
on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths: ['.github/workflows/quality-offline-kit.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: quality-dependency-prepared
          run-id: 36617848513
          github-token: ${{ github.token }}
          path: /tmp/deps
      - name: Download public modules and verification tools
        run: |
          set -euo pipefail
          cp /tmp/deps/updated/go.mod go.mod
          cp /tmp/deps/updated/go.sum go.sum
          go mod download
          go test -run '^$' ./...
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          mkdir -p /tmp/kit/bin /tmp/lint-download
          cd /tmp/lint-download
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-checksums.txt
          sha256sum --check --ignore-missing golangci-lint-2.14.0-checksums.txt
          tar -xzf golangci-lint-2.14.0-linux-amd64.tar.gz
          cp golangci-lint-2.14.0-linux-amd64/golangci-lint /tmp/kit/bin/
          cp "$(go env GOPATH)/bin/goimports" "$(go env GOPATH)/bin/govulncheck" /tmp/kit/bin/
          tar -C "$(go env GOROOT)" -czf /tmp/kit/go.tar.gz .
          tar -C "$(go env GOPATH)/pkg" --exclude='mod/cache/download/*/*.zip' -czf /tmp/kit/modules.tar.gz mod
      - uses: actions/upload-artifact@v4
        with:
          name: quality-offline-toolkit
          path: /tmp/kit/
          compression-level: 0
          retention-days: 3
