name: mongo-query-contract

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mongo-query-contract.yml'

permissions:
  contents: read

concurrency:
  group: mongo-query-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_QUERY_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: BSON wire and real MongoDB query contracts
        run: go test -race -count=3 -v -timeout 5m ./internal/web/blog/service ./internal/web/twitter/service -run TestMongo
