name: validate-mcp-upgrade

on:
  push:
    branches:
      - feat/mcp-protocol-2026-07-28

permissions:
  contents: read

concurrency:
  group: validate-mcp-upgrade
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-protocol-2026-07-28

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependency lock
        run: |
          go mod download github.com/mark3labs/mcp-go@v1.0.0-beta.1
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l internal/mcp/protocol_2026_07_28_test.go)"

      - name: Test MCP package
        run: go test -race -cover ./internal/mcp

      - name: Vet MCP package
        run: go vet ./internal/mcp
