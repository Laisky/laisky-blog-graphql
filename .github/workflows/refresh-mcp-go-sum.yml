name: validate-mcp-upgrade

on:
  push:
    branches:
      - feat/mcp-protocol-2026-07-28

permissions:
  contents: write

concurrency:
  group: validate-mcp-upgrade
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-protocol-2026-07-28

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: |
          go mod tidy
          git diff -- go.mod go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l internal/mcp/protocol_2026_07_28_test.go)"

      - name: Test MCP package
        run: go test -race -cover ./internal/mcp

      - name: Vet MCP package
        run: go vet ./internal/mcp

      - name: Commit tidy module files
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo 'go.mod and go.sum are already tidy.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'build(deps): tidy modules after MCP upgrade'
          git push origin HEAD:feat/mcp-protocol-2026-07-28
