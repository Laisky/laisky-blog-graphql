name: quality-publish-repair
on:
  push:
    branches: ['codex/mcp-sdk-20260929']
    paths:
      - '.github/workflows/quality-publish-repair.yml'
      - '.github/quality-repair.*.b64'
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.repository == 'Laisky/laisky-blog-graphql'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: quality-dependency-prepared
          run-id: 36617848513
          github-token: ${{ github.token }}
          path: /tmp/recovered-locks
      - name: Apply reviewed repairs with exact before and after digests
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd()
          chunks = [pathlib.Path(f'.github/quality-repair.{i}.b64') for i in range(3)]
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'c03d6fa5d1dbad3037224d8657dd04aba5f6a8f2a4ccb80bcb6e155265fd0203'
          manifest = json.loads(raw)
          files = manifest['files']
          def fingerprint():
              rows = []
              for name in files:
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert not p.is_symlink()
                  rows.append([name, hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None])
              return hashlib.sha256(json.dumps(rows, separators=(',', ':')).encode()).hexdigest()
          assert fingerprint() == manifest['before'], 'Reviewed source has changed; refusing to overwrite it'
          for name, entry in files.items():
              p = pathlib.Path(name)
              if entry is None:
                  p.unlink()
                  continue
              mode, edits = entry
              text = p.read_text() if p.exists() else ''
              for start, end, replacement in reversed(edits):
                  assert 0 <= start <= end <= len(text)
                  text = text[:start] + replacement + text[end:]
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)
              p.chmod(mode)
          assert fingerprint() == manifest['after'], 'Source repair digest mismatch'
          locks = ['go.mod', 'go.sum', 'web/package.json', 'web/pnpm-lock.yaml']
          for name in locks:
              shutil.copyfile(pathlib.Path('/tmp/recovered-locks/updated') / name, name)
          temporary = [str(p) for p in chunks] + [
              '.github/workflows/quality-dependency-prep.yml',
              '.github/workflows/quality-recovery.yml',
              '.github/workflows/quality-offline-kit.yml',
              '.github/workflows/quality-publish-repair.yml',
          ]
          for name in temporary:
              pathlib.Path(name).unlink()
          output = pathlib.Path('/tmp/quality-repair')
          output.mkdir()
          allowlist = sorted(set(files) | set(locks) | set(temporary) | {
              'internal/web/generated.go', 'internal/library/models/models.go'})
          (output / 'allowlist.json').write_text(json.dumps(allowlist))
      - name: Install pinned verification tools
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          mkdir -p /tmp/quality-lint-tools
          cd /tmp/quality-lint-tools
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
          curl --retry 3 -fsSLO https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-checksums.txt
          sha256sum --check --ignore-missing golangci-lint-2.14.0-checksums.txt
          tar -xzf golangci-lint-2.14.0-linux-amd64.tar.gz
          echo /tmp/quality-lint-tools/golangci-lint-2.14.0-linux-amd64 >> "$GITHUB_PATH"
      - name: Regenerate rather than hand-edit GraphQL artifacts
        run: |
          set -euo pipefail
          make gen
          go mod tidy
          go mod verify
          ./.scripts/check_go_format.sh
          git diff --check
      - name: Capture the exact allowlisted candidate before acceptance
        shell: python
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('/tmp/quality-repair')
          paths = json.loads((output / 'allowlist.json').read_text())
          subprocess.run(['git', 'add', '-A', '--', *paths], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          assert set(filter(None, changed)).issubset(paths)
          (output / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          (output / 'candidate-tree.txt').write_bytes(subprocess.check_output(['git', 'write-tree']))
      - uses: actions/upload-artifact@v4
        with:
          name: quality-repair-candidate
          path: /tmp/quality-repair/
          retention-days: 7
      - name: Full race-enabled behavior acceptance
        run: |
          set -euo pipefail
          go test -race -cover -count=1 -timeout 5m ./... 2>&1 | tee /tmp/quality-repair/full-tests.log
          go test -race -count=20 -timeout 5m ./internal/mcp -run TestMCPReview 2>&1 | tee /tmp/quality-repair/session-tests.log
      - name: Require zero full-project lint diagnostics
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          make lint 2>&1 | tee /tmp/quality-repair/make-lint.log
          golangci-lint run -c .golangci.lint.yml --max-issues-per-linter=0 --max-same-issues=0 --output.json.path=/tmp/quality-repair/lint.json
      - name: Build and imported-package vulnerability acceptance
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          go build ./...
          govulncheck -scan package -show verbose ./... 2>&1 | tee /tmp/quality-repair/package-vulnerabilities.log
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-repair-acceptance
          path: /tmp/quality-repair/
          retention-days: 7
  publish:
    needs: prepare
    if: github.repository == 'Laisky/laisky-blog-graphql' && github.ref == 'refs/heads/codex/mcp-sdk-20260929'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: quality-repair-candidate
          path: /tmp/quality-repair
      - name: Commit only the reviewed source and dependency repairs
        shell: python
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('/tmp/quality-repair')
          allowed = set(json.loads((output / 'allowlist.json').read_text()))
          subprocess.run(['git', 'apply', '--index', str(output / 'candidate.patch')], check=True)
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')))
          assert changed.issubset(allowed), 'Patch contains an unreviewed path'
          assert subprocess.check_output(['git', 'write-tree']).strip() == (output / 'candidate-tree.txt').read_bytes().strip()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: close project-wide lint, security and lifecycle defects'], check=True)
      - name: Fast-forward only the isolated feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/mcp-sdk-20260929
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/codex/mcp-sdk-20260929
