name: Bolt RAG tokenizer run monitor

on:
  push:
    branches:
      - 'ci/bolt-rag-tokenizer-run-monitor-20260823'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_BRANCH: ci/bolt-rag-tokenizer-final-validation-20260823
      VALIDATION_WORKFLOW: Bolt RAG tokenizer final validation
      TARGET_BRANCH: develop
    steps:
      - name: Publish validation and native workflow states
        shell: bash
        run: |
          set -euo pipefail
          target_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$target_sha"

          post_run_state() {
            local context=$1
            local workflow_name=$2
            local branch=$3
            local run
            run=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f branch="$branch" \
              -f per_page=50 \
              --jq ".workflow_runs | map(select(.name == \"${workflow_name}\")) | first")

            if [[ "$run" == "null" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
                -f state=pending \
                -f context="$context" \
                -f description="no ${workflow_name} run is visible yet" > /dev/null
              return
            fi

            local run_id status conclusion url state description
            run_id=$(jq -r '.id' <<< "$run")
            status=$(jq -r '.status' <<< "$run")
            conclusion=$(jq -r '.conclusion // "pending"' <<< "$run")
            url=$(jq -r '.html_url' <<< "$run")
            state=pending
            if [[ "$status" == completed ]]; then
              state=failure
              if [[ "$conclusion" == success ]]; then
                state=success
              fi
            fi
            description="${workflow_name}: ${status}/${conclusion}; run ${run_id}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$description" \
              -f target_url="$url" > /dev/null
            printf '%s run_id=%s status=%s conclusion=%s url=%s\n' "$context" "$run_id" "$status" "$conclusion" "$url"
          }

          post_run_state 'bolt/validation-monitor' "$VALIDATION_WORKFLOW" "$VALIDATION_BRANCH"
          post_run_state 'bolt/native-linter-monitor' 'Linter' "$TARGET_BRANCH"
          post_run_state 'bolt/native-codeql-monitor' 'CodeQL' "$TARGET_BRANCH"
