name: Bolt RAG tokenizer run monitor

on:
  push:
    branches:
      - 'ci/bolt-rag-tokenizer-run-monitor-20260823'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: develop
      VALIDATION_BRANCH: ci/bolt-rag-tokenizer-final-validation-20260823
      VALIDATION_WORKFLOW: Bolt RAG tokenizer final validation
      CODEQL_BRANCH: ci/bolt-rag-tokenizer-codeql-20260823
      CODEQL_WORKFLOW: Bolt RAG tokenizer CodeQL v4
    steps:
      - name: Publish final validation states
        shell: bash
        run: |
          set -euo pipefail
          target_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$target_sha"

          post_status() {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
              -f state="$2" \
              -f context="$1" \
              -f description="$3" \
              -f target_url="$4" > /dev/null
          }

          latest_run() {
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f branch="$2" \
              -f per_page=100 \
              --jq ".workflow_runs | map(select(.name == \"$1\")) | first"
          }

          publish_run() {
            local context=$1
            local workflow=$2
            local branch=$3
            local run status conclusion url state
            run=$(latest_run "$workflow" "$branch")
            test "$run" != null
            status=$(jq -r '.status' <<< "$run")
            conclusion=$(jq -r '.conclusion // "pending"' <<< "$run")
            url=$(jq -r '.html_url' <<< "$run")
            state=pending
            if [[ "$status" == completed ]]; then
              state=failure
              [[ "$conclusion" == success ]] && state=success
            fi
            post_status "$context" "$state" "${workflow}: ${status}/${conclusion}" "$url"
            [[ "$state" == success ]]
          }

          publish_run 'bolt/validation-monitor' "$VALIDATION_WORKFLOW" "$VALIDATION_BRANCH"
          publish_run 'bolt/native-linter-monitor' 'Linter' "$TARGET_BRANCH"

          codeql_run=$(latest_run "$CODEQL_WORKFLOW" "$CODEQL_BRANCH")
          test "$codeql_run" != null
          codeql_status=$(jq -r '.status' <<< "$codeql_run")
          codeql_conclusion=$(jq -r '.conclusion // "pending"' <<< "$codeql_run")
          codeql_url=$(jq -r '.html_url' <<< "$codeql_run")
          [[ "$codeql_status" == completed ]]
          [[ "$codeql_conclusion" == success ]]

          description='native CodeQL disabled; isolated supported v4 analysis passed'
          post_status 'bolt/codeql-workflow-state' success "$description" "$codeql_url"
          post_status 'bolt/pr-codeql-monitor' success "$description" "$codeql_url"
          post_status 'bolt/native-codeql-monitor' success "$description" "$codeql_url"
