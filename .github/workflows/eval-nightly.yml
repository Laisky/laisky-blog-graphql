# Phase 1 ships rag only; pageindex is added to the matrix when Phase 2 lands.
name: eval-nightly

# The historical name is retained; evaluation is now opt-in, not nightly or per-PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Phase 2 expands this to [rag, pageindex].
        plugin: [rag]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run eval harness
        id: eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          set -o pipefail
          mkdir -p docs/eval/runs
          make eval-plugin PLUGIN=${{ matrix.plugin }} | tee eval-output.txt

      - name: Upload scorecard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.plugin }}-${{ github.sha }}
          path: docs/eval/runs/**
          if-no-files-found: warn
