version: '2'
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - decorder
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - ginkgolinter
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - godox
    - err113
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    # - tagalign
    - testableexamples
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - zerologlint

  settings:
    revive:
      # Listing any rule replaces revive's default rule set, so only the
      # rules named here run. With just one disabled rule, revive currently
      # reports nothing; see docs/ref/golangci_lint.md before widening it.
      rules:
        - name: indent-error-flow
          disabled: true
    gomoddirectives:
      replace-local: true
    dupl:
      threshold: 200
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 35
    goconst:
      min-len: 3
      min-occurrences: 3
    godox:
      keywords: [NOTE, OPTIMIZE, HACK]
    lll:
      line-length: 256
      tab-width: 4
    gosec:
      # G404: math/rand only drives jitter, seeded resampling and provider rotation.
      excludes: [G301, G304, G404]
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    testpackage:
      skip-regexp: (export|internal)_test\.go
    whitespace:
      multi-if: false
      multi-func: false

  exclusions:
    generated: strict
    # Report exclusions that no longer match anything so they get pruned.
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
  fix: false

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order: [linter, file]
  show-stats: true

run:
  timeout: 5m
  relative-path-mode: gomod
  issues-exit-code: 1
  tests: false
  allow-parallel-runners: false
  allow-serial-runners: false
  concurrency: 4

severity:
  default: error
  rules:
    - linters: [dupl]
      severity: info
